name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    name: cocotb regression (Icarus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install oss-cad-suite (Icarus, Yosys)
        run: ./ci/install-oss-cad-suite.sh "$HOME/ocs/oss-cad-suite"

      - name: Install cocotb
        run: pip install cocotb

      - name: Core regression
        run: python3 sim/run.py
        env:
          PATH: ${{ env.HOME }}/ocs/oss-cad-suite/bin:${{ env.PATH }}

      - name: PMP unit
        run: python3 sim/run.py --suite pmp

      - name: PLIC unit
        run: python3 sim/run.py --suite plic

      - name: Elaborate the core
        run: |
          export PATH="$HOME/ocs/oss-cad-suite/bin:$PATH"
          iverilog -g2012 -o /tmp/core.vvp -s riscv_core_top rtl/*.sv

  uvm:
    name: UVM regression (xezim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install xezim
        run: ./ci/install-xezim.sh "$HOME/xezim"

      - name: Generate golden vectors
        run: |
          python3 sim/gen_uvm_vectors.py
          python3 sim/gen_isa_sweep.py

      - name: UVM regression
        run: bash sim/run_uvm.sh
        env:
          XEZIM: ${{ env.HOME }}/xezim/bin/xezim
          UVM_HOME: ${{ env.HOME }}/xezim/share/uvm/src

  synthesis:
    name: Synthesis (sv2v + Yosys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install oss-cad-suite
        run: ./ci/install-oss-cad-suite.sh "$HOME/ocs/oss-cad-suite"

      - name: Synthesize
        run: ./sim/synth.sh
        env:
          PATH: ${{ env.HOME }}/ocs/oss-cad-suite/bin:${{ env.PATH }}
