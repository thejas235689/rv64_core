name: regression

# -----------------------------------------------------------------------------
# The regression job. What was wrong with the previous version, and why each
# change is here rather than being a style preference:
#
# 1. `python3 sim/run.py` with no --testcase raised TypeError before the build.
#    --testcase is argparse `append` with default=None and every dispatch branch
#    does `any(t.startswith(...) for t in args.testcase)`, so an unset flag made
#    `None` iterable. sim/run.py now normalises it (`tests = args.testcase or []`).
#    Step "Assert run.py normalises --testcase" fails loudly if that line is ever
#    removed again, instead of the job dying with a bare traceback.
#
# 2. The lint step carried its own hand-written 11-file list. It omitted
#    rv64_num_pkg.sv and the rtl/fpu blocks, so iverilog exited 2 on syntax
#    errors that did not exist in the design. The list now comes from
#    `python3 sim/run.py --list-rtl`, the same list the build compiles.
#
# 3. A bare `python3` is not a fixed thing. Under oss-cad-suite's PATH it
#    resolves to the suite's bundled interpreter (tabbypy3) and cocotb logs
#    "Unexpected sys.executable value". Every python invocation below is
#    /usr/local/bin/python3, and a step asserts it.
#
# 4. One `python3 sim/run.py` for the whole suite outruns a CI step timeout, and
#    a timed-out step reports nothing. The suite runs in batches through
#    ci/run_batches.sh, which also scores it honestly: an aborted elaboration
#    emits no UVM_ERROR and used to be scored PASS. A batch now has to exit 0,
#    show no simulator-level error, print a report summary, produce a
#    results.xml with testcase entries, and account for every requested test
#    before any of it counts as passing.
#
# Note on the PSS tests: test_pss_alu, test_pss_memory and test_pss_word need the
# external `satya` solver. Without it they fail, and a test that cannot run is
# reported as FAIL, not quietly skipped. To declare that dependency absent, set
# the repository variable ALLOWED_SKIP_TESTS to those names; the job then ends
# "PASS WITH SKIPS" rather than claiming a clean pass.
# -----------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # One place to change it. Everything below uses this, never a bare python3.
      PYTHON: /usr/local/bin/python3
      # Repository variable, empty by default: nothing is excused unless written down.
      ALLOWED_SKIP_TESTS: ${{ vars.ALLOWED_SKIP_TESTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Install simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog

      - name: Install cocotb into the pinned interpreter
        # No actions/setup-python on purpose. It installs an interpreter under
        # /opt/hostedtoolcache and puts it first on PATH, which is a different
        # interpreter from the one every step below is pinned to. Installing into
        # /usr/local/bin/python3 keeps one interpreter for the whole job.
        # --break-system-packages because the runner's system Python is marked
        # externally managed (PEP 668) and has no venv here.
        run: |
          "$PYTHON" -m pip install --quiet --break-system-packages cocotb

      - name: Assert the interpreter is the pinned one
        run: |
          "$PYTHON" -c 'import sys; assert sys.executable == "/usr/local/bin/python3", sys.executable; print("pinned interpreter:", sys.executable, sys.version.split()[0])'
          "$PYTHON" -c 'import cocotb; print("cocotb", cocotb.__version__)'
          echo "bare python3 resolves to: $(command -v python3 || echo none)"
          echo "PYTHONEXECUTABLE=${PYTHONEXECUTABLE:-<unset>}"
          # sed, not `head -1`: under the runner's -o pipefail, head closing the
          # pipe early can turn a successful iverilog into a failed step.
          iverilog -V 2>&1 | sed -n 1p

      - name: Assert run.py normalises an absent --testcase
        # Problem 1, guarded. If this line disappears, `python3 sim/run.py` with
        # no --testcase goes back to TypeError: 'NoneType' is not iterable.
        run: |
          grep -nE '^[[:space:]]*tests = args\.testcase or \[\]' sim/run.py \
            || { echo "sim/run.py no longer normalises args.testcase; a bare run.py will crash again"; exit 1; }
          "$PYTHON" sim/run.py --help > /dev/null
          echo "run.py accepts a bare invocation (argument parsing and dispatch reached)"

      - name: Lint (Icarus, -Wall, RTL list from run.py)
        # The file list is not written here. It is asked for. A second copy of
        # the list is what went stale and produced phantom syntax errors.
        run: |
          mapfile -t RTL < <("$PYTHON" sim/run.py --list-rtl)
          echo "RTL sources: ${#RTL[@]}"
          printf '  %s\n' "${RTL[@]}"
          # A truncated list lints nothing and exits 0, which is not a pass.
          if [ "${#RTL[@]}" -lt 40 ]; then
            echo "RTL list looks truncated (${#RTL[@]} files) -- refusing to lint nothing"
            exit 1
          fi
          for f in "${RTL[@]}"; do
            [ -f "$f" ] || { echo "listed source does not exist: $f"; exit 1; }
          done
          iverilog -g2012 -Wall -o /dev/null -s riscv_core_top "${RTL[@]}"

      - name: Core regression (batched, honest scoring)
        # Batches keep each invocation inside the step limit; run_batches.sh
        # fails on a simulator-level error, a non-zero exit, a missing report
        # summary, or a requested test that never reported.
        run: bash ci/run_batches.sh
        env:
          BATCH_SIZE: "8"
          BATCH_TIMEOUT: "900"

      - name: PLIC-lite regression (batched, honest scoring)
        run: bash ci/run_batches.sh
        env:
          SUITE: plic
          MODULE_FILE: tb/cocotb/test_plic.py
          BATCH_SIZE: "4"
          BATCH_TIMEOUT: "600"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocotb-results
          # results.xml lands in the build dir, not next to the testbench. The
          # old glob (sim/**/results.xml) matched nothing and the step was
          # configured to ignore that, so the artifact was silently empty.
          path: |
            sim/sim_build_*/results.xml
            ci/logs/
          if-no-files-found: warn
