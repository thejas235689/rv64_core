name: regression

# -----------------------------------------------------------------------------
# The regression job. What was wrong with the previous version, and why each
# change is here rather than being a style preference:
#
# 1. `python3 sim/run.py` with no --testcase raised TypeError before the build.
#    --testcase is argparse `append` with default=None and every dispatch branch
#    does `any(t.startswith(...) for t in args.testcase)`, so an unset flag made
#    `None` iterable. sim/run.py now normalises it (`tests = args.testcase or []`).
#    Step "Assert run.py normalises --testcase" fails loudly if that line is ever
#    removed again, instead of the job dying with a bare traceback.
#
# 2. The lint step carried its own hand-written 11-file list. It omitted
#    rv64_num_pkg.sv and the rtl/fpu blocks, so iverilog exited 2 on syntax
#    errors that did not exist in the design. The list now comes from
#    `python3 sim/run.py --list-rtl`, the same list the build compiles.
#
# 3. A bare `python3` is not a fixed thing. Under oss-cad-suite's PATH it
#    resolves to the suite's bundled interpreter (tabbypy3) and cocotb logs
#    "Unexpected sys.executable value". Every python invocation below is
#    /usr/local/bin/python3, and a step asserts it.
#
# 4. One `python3 sim/run.py` for the whole suite outruns a CI step timeout, and
#    a timed-out step reports nothing. The suite runs in batches through
#    ci/run_batches.sh, which also scores it honestly: an aborted elaboration
#    emits no UVM_ERROR and used to be scored PASS. A batch now has to exit 0,
#    show no simulator-level error, print a report summary, produce a
#    results.xml with testcase entries, and account for every requested test
#    before any of it counts as passing.
#
# 5. Nothing tested the documents against the hardware. The README said "misa
#    advertises RV64IM", the feature contract said the same, the RTL said
#    0x8000000000141125, and the README also said "C, F, D and V are rejected as
#    illegal" while C and A were implemented -- five contradictions at once, none
#    caught. The "ISA conformance" step now reads isa/rv64_profile.yaml and fails
#    on any of them.
#
# Note on PSS tests: the Satya-dependent tests use Cocotb's native skip flag
# when the external `satya` executable is unavailable. They are then reported
# as SKIP in the regression summary, not as PASS or FAIL. When Satya is present,
# generator/solver errors remain real test failures.
# -----------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # One place to change it. Everything below uses this, never a bare python3.
      PYTHON: python3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve Python executable for regression scripts
        run: echo "PYTHON=$(command -v python3)" >> "$GITHUB_ENV"

      - name: Install simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog

      - name: Install cocotb and PyYAML into the pinned interpreter
        # No actions/setup-python on purpose. It installs an interpreter under
        # /opt/hostedtoolcache and puts it first on PATH, which is a different
        # interpreter from the one every step below is pinned to. Installing into
        # /usr/local/bin/python3 keeps one interpreter for the whole job.
        # --break-system-packages because the runner's system Python is marked
        # externally managed (PEP 668) and has no venv here.
        run: |
          # pyyaml: isa/rv64_profile.yaml is YAML, and the conformance test reads
          # it at import time. Without it that suite cannot even be collected.
          "$PYTHON" -m pip install --quiet --break-system-packages cocotb pyyaml

      - name: Assert the interpreter is the pinned one
        run: |
          "$PYTHON" -c 'import shutil,sys; assert sys.executable == shutil.which("python3"), (sys.executable, shutil.which("python3")); print("pinned interpreter:", sys.executable, sys.version.split()[0])'
          "$PYTHON" -c 'import cocotb; print("cocotb", cocotb.__version__)'
          "$PYTHON" -c 'import yaml; print("pyyaml", yaml.__version__)'
          echo "bare python3 resolves to: $(command -v python3 || echo none)"
          echo "PYTHONEXECUTABLE=${PYTHONEXECUTABLE:-<unset>}"
          # sed, not `head -1`: under the runner's -o pipefail, head closing the
          # pipe early can turn a successful iverilog into a failed step.
          iverilog -V 2>&1 | sed -n 1p

      - name: Assert run.py normalises an absent --testcase
        # Problem 1, guarded. If this line disappears, `python3 sim/run.py` with
        # no --testcase goes back to TypeError: 'NoneType' is not iterable.
        run: |
          grep -nE '^[[:space:]]*tests = args\.testcase or \[\]' sim/run.py \
            || { echo "sim/run.py no longer normalises args.testcase; a bare run.py will crash again"; exit 1; }
          "$PYTHON" sim/run.py --help > /dev/null
          echo "run.py accepts a bare invocation (argument parsing and dispatch reached)"

      - name: Lint (Icarus, -Wall, RTL list from run.py)
        # The file list is not written here. It is asked for. A second copy of
        # the list is what went stale and produced phantom syntax errors.
        run: |
          mapfile -t RTL < <("$PYTHON" sim/run.py --list-rtl)
          echo "RTL sources: ${#RTL[@]}"
          printf '  %s\n' "${RTL[@]}"
          # A truncated list lints nothing and exits 0, which is not a pass.
          if [ "${#RTL[@]}" -lt 40 ]; then
            echo "RTL list looks truncated (${#RTL[@]} files) -- refusing to lint nothing"
            exit 1
          fi
          for f in "${RTL[@]}"; do
            [ -f "$f" ] || { echo "listed source does not exist: $f"; exit 1; }
          done
          iverilog -g2012 -Wall -o /dev/null -s riscv_core_top "${RTL[@]}"

      - name: ISA conformance (profile vs RTL vs ISS vs docs)
        # The gate for phase 1. It reads isa/rv64_profile.yaml and fails when the
        # DUT's misa, the ISS's misa, README.md or the feature contract disagree
        # with it, when an advertised extension's instruction traps, when a
        # not-claimed extension does not behave as the profile records, when the
        # profile's CSR windows are not the ones the RTL decodes, or when a bus
        # signal the profile names is missing from the top level.
        #
        # Batched and scored by the same honest runner as the rest of the suite,
        # so a test that silently does not run cannot pass.
        run: bash ci/run_batches.sh
        env:
          SUITE: conformance
          MODULE_FILE: tb/cocotb/test_isa_conformance.py
          BATCH_SIZE: "6"
          BATCH_TIMEOUT: "600"

      - name: Detect optional Satya PSS solver
        # The solver is not installed by the default GitHub runner. Do not let
        # its absence masquerade as an RTL failure; record exactly which PSS
        # checks are not exercised. If Satya is present, all PSS tests remain
        # mandatory and their failures fail CI.
        run: |
          SATYA_BIN="${SATYA:-satya}"
          if command -v "$SATYA_BIN" >/dev/null 2>&1; then
            echo "Satya solver found: $(command -v "$SATYA_BIN")"
            echo "SATYA_AVAILABLE=1" >> "$GITHUB_ENV"
            echo "PSS tests will run as mandatory tests."
          else
            echo "Satya solver unavailable: $SATYA_BIN"
            echo "SATYA_AVAILABLE=0" >> "$GITHUB_ENV"
            echo "ALLOWED_SKIP_TESTS=test_pss_alu test_pss_alu_drives_core test_pss_memory test_pss_word" >> "$GITHUB_ENV"
            echo "::warning::Satya is not installed; four Satya-dependent PSS tests will be excluded and reported SKIP. This is not a full PSS verification pass."
          fi

      - name: Core regression (batched, honest scoring)
        # Batches keep each invocation inside the step limit; run_batches.sh
        # fails on a simulator-level error, a non-zero exit, a missing report
        # summary, or a requested test that never reported.
        run: bash ci/run_batches.sh
        env:
          BATCH_SIZE: "8"
          BATCH_TIMEOUT: "900"

      - name: Targeted posit and quire regression
        if: always()
        # Explicitly exercises the variable-width posit regime decoder and
        # quire operations changed in this PR; this test is not in the core
        # batch list, so keep it as a dedicated gate.
        run: '"$PYTHON" sim/run.py --testcase test_posit_quire'

      - name: PLIC-lite regression (batched, honest scoring)
        run: bash ci/run_batches.sh
        env:
          SUITE: plic
          MODULE_FILE: tb/cocotb/test_plic.py
          BATCH_SIZE: "4"
          BATCH_TIMEOUT: "600"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocotb-results
          # results.xml lands in the build dir, not next to the testbench. The
          # old glob (sim/**/results.xml) matched nothing and the step was
          # configured to ignore that, so the artifact was silently empty.
          path: |
            sim/sim_build_*/results.xml
            ci/logs/
          if-no-files-found: warn

  verilator-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends verilator

      - name: Lint the canonical RTL source list
        run: |
          set -euo pipefail
          mkdir -p ci/logs
          mapfile -t RTL < <(python3 sim/run.py --list-rtl)
          echo "Verilator: $(verilator --version)"
          echo "RTL sources: ${#RTL[@]}"
          if [ "${#RTL[@]}" -lt 40 ]; then
            echo "RTL source list is incomplete; refusing to run an empty lint"
            exit 1
          fi
          for f in "${RTL[@]}"; do
            [ -f "$f" ] || { echo "missing RTL source: $f"; exit 1; }
          done
          verilator --lint-only --timing -sv -Wall -Wno-fatal \
            --top-module riscv_core_top "${RTL[@]}" 2>&1 | tee ci/logs/verilator-lint.log
